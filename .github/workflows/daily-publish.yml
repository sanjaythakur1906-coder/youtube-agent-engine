name: Daily Autonomous YouTube Publishing Engine

on:
  schedule:
    # Runs daily at 10:00 AM UTC (3:30 PM IST)
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      format:
        description: 'Video Format'
        required: true
        default: 'short'
        type: choice
        options:
          - short
          - long
      privacy:
        description: 'YouTube Privacy Status'
        required: true
        default: 'private'
        type: choice
        options:
          - private
          - unlisted
          - public

jobs:
  publish:
    name: Build & Dispatch Video for Telegram Approval
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore Credentials from GitHub Secrets
        run: |
          mkdir -p credentials
          if [ -n "$YOUTUBE_TOKEN_JSON" ]; then
            echo "$YOUTUBE_TOKEN_JSON" > credentials/token.json
          fi
          if [ -n "$CLIENT_SECRETS_JSON" ]; then
            echo "$CLIENT_SECRETS_JSON" > credentials/client_secrets.json
          fi
          if [ -n "$TELEGRAM_JSON" ]; then
            echo "$TELEGRAM_JSON" > credentials/telegram.json
          fi
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          CLIENT_SECRETS_JSON: ${{ secrets.CLIENT_SECRETS_JSON }}
          TELEGRAM_JSON: ${{ secrets.TELEGRAM_JSON }}

      - name: Run Daily Publisher
        run: |
          python tools/daily_publisher.py \
            --format "${{ github.event.inputs.format || 'short' }}" \
            --privacy "${{ github.event.inputs.privacy || 'private' }}"
        env:
          PYTHONUNBUFFERED: "1"
          REVIEW_TIMEOUT_SECONDS: "7200"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit Topic History
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/history.json || true
          if git diff --staged --quiet; then
            echo "No history changes to commit."
          else
            git commit -m "chore: record published video in history [skip ci]"
            git push origin main
          fi
