services:
  # Daily Cron Job on Render
  - type: cron
    name: youtube-daily-publisher
    env: docker
    dockerfilePath: ./Dockerfile
    schedule: "0 10 * * *" # Every day at 10:00 AM UTC
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
